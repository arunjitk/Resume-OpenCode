name: Deploy to VPS (Docker)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy Docker Container
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Optional: Add version tagging
      - name: Generate version tag
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "build_date=$(date -u +'%Y-%m-%d_%H-%M-%S')" >> $GITHUB_OUTPUT

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e
            cd /root/Resume-OpenCode

            echo "=== Pulling latest code ==="
            git fetch origin main
            git reset --hard origin/main

            echo "=== Checking .env file ==="
            if [ ! -f .env ]; then
              echo "WARNING: .env file not found. Creating minimal .env"
              echo "PORT=3000" > .env
            fi

            echo "=== Building and deploying Docker container ==="
            cd /docker/resume
            docker compose down
            docker compose build --no-cache
            docker compose up -d

            echo "=== Verifying deployment ==="
            sleep 5
            if docker ps | grep -q resume-resume-1; then
              echo "✅ Container is running"
              docker ps | grep resume
            else
              echo "❌ Container failed to start"
              exit 1
            fi

            echo "=== Cleaning up old images ==="
            docker image prune -f

            echo "=== Deployment complete ==="

      - name: Notify success
        if: success()
        run: echo "✅ Deployed successfully to https://arunjitk.org"

      - name: Notify failure
        if: failure()
        run: echo "❌ Deployment failed"
